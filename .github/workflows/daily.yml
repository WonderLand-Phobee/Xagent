name: Daily verified edition
on:
  schedule:
    - cron: '0 2 * * *' # 10:00 Asia/Hong_Kong. GitHub scheduling can be delayed.
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pipeline/**', 'scripts/collect-live.mjs', '.github/workflows/daily.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: offertoday-daily
  # A newer code revision or explicit rerun supersedes an obsolete crawl.
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      generation: ${{ steps.generate.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: pip install -r requirements.txt
      - name: Generate and reverify today's edition
        id: generate
        continue-on-error: true
        env:
          # User explicitly requested bounded collection from www public pages.
          # Set this repository variable to false to pause; robots/challenges still stop collection.
          OFFERTODAY_SOURCE_APPROVED: ${{ vars.OFFERTODAY_SOURCE_APPROVED != 'false' }}
        run: python -m pipeline.run
      - name: Save snapshots including source failure health
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh verified Hong Kong daily edition'
            for attempt in 1 2 3; do
              git fetch origin main:refs/remotes/origin/main
              git rebase refs/remotes/origin/main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edition-snapshot
          path: data/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-audit
          path: data/audit/
  # Same workflow deploy: pushes from GITHUB_TOKEN do not trigger other workflows.
  deploy:
    needs: generate
    if: always() && needs.generate.result == 'success'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
  health:
    needs: [generate, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report blocked generation or deployment
        env:
          GENERATION: ${{ needs.generate.outputs.generation }}
          GENERATE_JOB: ${{ needs.generate.result }}
          DEPLOY_JOB: ${{ needs.deploy.result }}
          PUBLISHED: ${{ needs.deploy.outputs.published }}
        run: |
          if [ "$GENERATION" != 'success' ] || [ "$GENERATE_JOB" != 'success' ] || [ "$DEPLOY_JOB" != 'success' ]; then
            exit 1
          fi
          if [ "$PUBLISHED" != 'true' ]; then
            echo '::notice::Collection completed, but Pages is not configured. No website publication is claimed.'
          fi

  remind:
    needs: [generate, deploy]
    if: ${{ always() && vars.ENABLE_REMINDERS == 'true' && vars.REMINDER_CHANNEL != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: edition-snapshot
          path: data
      - name: Send page reminder (never publishes to X)
        env:
          REMINDER_CHANNEL: ${{ vars.REMINDER_CHANNEL }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          REMINDER_FROM: ${{ vars.REMINDER_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REMINDER_TO: ${{ secrets.REMINDER_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOYMENT_OK: ${{ needs.deploy.outputs.published == 'true' }}
        run: python -m pipeline.notify
